<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>El Tio J · Catálogo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; }
    body { background: radial-gradient(circle at 70% 20%, #0f0f1a 0%, #020205 100%); display: flex; justify-content: center; align-items: center; padding: 12px; position: relative; }
    body::before { content: "EL TIO J"; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg) scale(1.2); font-size: clamp(3rem, 15vw, 10rem); font-weight: 900; color: rgba(0, 255, 255, 0.04); white-space: nowrap; letter-spacing: 12px; text-transform: uppercase; pointer-events: none; z-index: 1; animation: floatLogo 20s infinite alternate ease-in-out; }
    @keyframes floatLogo { 0% { transform: translate(-50%, -50%) rotate(-12deg) scale(1.2); opacity: 0.04; } 100% { transform: translate(-48%, -52%) rotate(-8deg) scale(1.25); opacity: 0.08; } }
    .kiosco { width: 100%; max-width: 1280px; height: 100%; background: rgba(6, 6, 12, 0.85); backdrop-filter: blur(8px); border: 3px solid #00ffff; border-radius: 30px; box-shadow: 0 0 40px #00ffff, inset 0 0 20px rgba(0, 255, 255, 0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 10; animation: borderPulse 3s infinite; }
    @keyframes borderPulse { 0%, 100% { border-color: #00ffff; box-shadow: 0 0 40px #00ffff; } 50% { border-color: #ff00ff; box-shadow: 0 0 60px #ff00ff; } }
    .header { padding: 1.5rem 1.5rem 0.8rem; text-align: center; border-bottom: 2px solid #ff00ff; background: linear-gradient(180deg, rgba(255, 0, 255, 0.15) 0%, transparent 100%); }
    .logo-masquehigh { font-size: 4.8rem; font-weight: 900; background: linear-gradient(135deg, #00ffff, #ff00ff, #ffff00, #00ff88); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 255, 255, 0.5); line-height: 1.1; animation: rainbowShift 2s infinite; }
    @keyframes rainbowShift { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(30deg); } }
    .logo-club { font-size: 3.5rem; font-weight: 900; letter-spacing: 12px; background: linear-gradient(135deg, #ffff00, #ff00ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: -0.5rem; text-shadow: 0 0 20px rgba(255, 255, 0, 0.5); }
    .welcome { font-size: 1.6rem; color: #ffff00; background: rgba(255, 255, 0, 0.1); padding: 0.3rem 1.5rem; border-radius: 40px; display: inline-block; border: 1px solid #ffff00; box-shadow: 0 0 15px rgba(255, 255, 0, 0.3); }
    
    .pestanas-wrapper {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 1rem 1rem;
      scrollbar-width: thin;
    }
    .pestanas { display: flex; gap: 1rem; min-width: max-content; }
    .pestana { 
      background: rgba(8, 8, 16, 0.9); 
      border: 2px solid; 
      border-radius: 20px; 
      padding: 1rem 1.8rem; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      min-width: 150px; 
    }
    .pestana-icon { font-size: 2.5rem; }
    .pestana-text { font-size: 1.3rem; font-weight: 700; white-space: nowrap; color: white; letter-spacing: 1px; }
    .pestana.activa { transform: scale(1.02); border-width: 3px; background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 25px currentColor; }
    
    .contenido { flex: 1; overflow-y: auto; padding: 1.2rem; }
    .panel { display: none; }
    .panel.activo { display: block; }
    
    .subseccion { background: rgba(4, 4, 10, 0.7); border-radius: 24px; padding: 1.2rem; margin-bottom: 1.5rem; }
    .subseccion-titulo { font-size: 2.2rem; margin-bottom: 1.2rem; padding-left: 1rem; border-left: 8px solid; text-shadow: 0 0 10px currentColor; }
    
    .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
    .producto-card { background: rgba(10, 10, 18, 0.9); border: 2px solid; border-radius: 24px; padding: 1.2rem 0.8rem; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all 0.2s ease; cursor: pointer; }
    .producto-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 0 25px currentColor; }
    .producto-card img { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 3px solid; margin-bottom: 0.8rem; box-shadow: 0 0 15px currentColor; background: #0a0a12; }
    .producto-card h4 { font-size: 1.4rem; color: white; margin-bottom: 0.5rem; }
    .producto-precio { font-size: 1.5rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 40px; display: inline-block; background: rgba(0,0,0,0.5); border: 2px solid; }
    
    .liados-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .liado-card { background: linear-gradient(145deg, #0e0e18, #080810); border: 2px solid; border-radius: 24px; padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all 0.2s ease; }
    .liado-card:hover { transform: translateY(-5px); box-shadow: 0 0 25px currentColor; }
    .liado-icon { font-size: 5rem; margin-bottom: 0.8rem; filter: drop-shadow(0 0 10px currentColor); }
    .liado-card h4 { font-size: 1.6rem; margin-bottom: 0.8rem; }
    .liado-precio { font-size: 1.5rem; font-weight: 800; padding: 0.4rem 1.5rem; border-radius: 40px; display: inline-block; background: rgba(0,0,0,0.5); border: 2px solid; }
    
    .munchies-categoria { background: rgba(6, 6, 14, 0.6); border: 2px solid; border-radius: 30px; padding: 1.5rem 1.5rem; margin-bottom: 1.5rem; }
    .categoria-titulo { font-size: 2.8rem; margin-bottom: 1.5rem; border-bottom: 3px solid; padding-bottom: 0.5rem; display: inline-block; text-shadow: 0 0 10px currentColor; }
    .items-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .item-munchi { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.5); padding: 1rem 1.5rem; border-radius: 60px; border: 2px solid; transition: all 0.2s ease; }
    .item-munchi:hover { transform: translateX(5px); box-shadow: 0 0 15px currentColor; }
    .item-nombre { font-size: 1.5rem; color: white; text-transform: uppercase; font-weight: 600; }
    .item-precio { font-size: 1.6rem; font-weight: 800; }
    
    .eventos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; padding: 0.5rem; }
    .evento-card { background: transparent; border: 3px solid; border-radius: 24px; overflow: hidden; aspect-ratio: 1/1.2; position: relative; transition: all 0.2s ease; cursor: pointer; }
    .evento-card:hover { transform: scale(1.02); box-shadow: 0 0 30px currentColor; }
    .evento-card img { width: 100%; height: 100%; object-fit: cover; display: block; background: #0a0a12; }
    .evento-delete { position: absolute; top: 8px; right: 8px; background: #ff00ff; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 22px; cursor: pointer; display: none; z-index: 100; box-shadow: 0 0 10px #ff00ff; }
    .admin-mode .evento-delete { display: block; }
    
    .save-indicator { position: fixed; bottom: 100px; right: 30px; background: #ffff00; color: black; padding: 15px 25px; border-radius: 50px; font-size: 1.6rem; font-weight: bold; box-shadow: 0 0 25px #ffff00; z-index: 2100; display: none; border: 2px solid #00ffff; }

    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .admin-card { 
      background: #0c0c16; 
      border: 2px solid; 
      border-radius: 20px; 
      padding: 15px; 
      cursor: grab;
      transition: all 0.2s ease;
    }
    .admin-card:active { cursor: grabbing; }
    .admin-card.dragging { opacity: 0.5; cursor: grabbing; }
    .admin-card.drag-over { border: 3px dashed; background: #16162a; }
    .admin-img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 10px; border: 2px solid; background: #0a0a12; }
    .admin-input { width: 100%; padding: 12px; margin-bottom: 10px; background: #030308; border: 2px solid #22223b; border-radius: 10px; color: white; font-size: 1.4rem; }
    .admin-input:focus { outline: none; border-color: currentColor; }
    .admin-precio { width: 100%; padding: 12px; margin-bottom: 10px; background: #030308; border: 2px solid; border-radius: 10px; font-size: 1.4rem; font-weight: bold; }
    .admin-file-input { display: none; }
    .admin-btn { width: 100%; padding: 12px; border: none; border-radius: 30px; font-size: 1.4rem; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
    .btn-upload { background: #22223b; color: white; border: 1px solid; }
    .btn-delete { background: #ff00ff; color: white; }
    .drag-handle { 
      text-align: center; 
      font-size: 1.2rem; 
      margin-bottom: 10px; 
      cursor: grab;
      background: rgba(255,255,255,0.05);
      border-radius: 30px;
      padding: 5px;
      border: 1px solid;
    }
    .drag-handle:active { cursor: grabbing; }
    
    .image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); z-index: 10000; justify-content: center; align-items: center; cursor: pointer; }
    .image-modal.active { display: flex; }
    .modal-content { max-width: 90vw; max-height: 90vh; position: relative; border-radius: 30px; box-shadow: 0 0 60px rgba(0, 255, 255, 0.6); border: 3px solid #00ffff; background: #050508; padding: 8px; }
    .modal-content img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 24px; }
    .close-modal { position: absolute; top: -20px; right: -20px; background: #ff00ff; color: white; font-size: 32px; font-weight: bold; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid #00ffff; box-shadow: 0 0 20px #ff00ff; }
  </style>
</head>
<body>
  <main class="kiosco">
    <div class="header">
      <div class="logo">
        <div class="logo-masquehigh">EL TIO J</div>
        <div class="logo-club">CLUB</div>
      </div>
      <div class="welcome">✨ Bienvenido a El Tio J Club ✨</div>
    </div>

    <div class="pestanas-wrapper">
      <div class="pestanas" id="pestanasContainer"></div>
    </div>

    <div class="contenido" id="contenidoPaneles"></div>
  </main>

  <div id="imageModal" class="image-modal" onclick="cerrarModalImagen()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img id="modalImage" src="" alt="Vista ampliada">
      <div class="close-modal" onclick="cerrarModalImagen()">✖</div>
    </div>
  </div>

  <div id="firebase-status" role="status" style="position:fixed;left:12px;bottom:12px;z-index:2500;background:#141421;color:#fff;border:1px solid #00ffff;border-radius:12px;padding:8px 12px;font:14px Segoe UI, sans-serif;display:none;"></div>

  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script defer src="./firebase-sync.js"></script>
  <script>
    
    const COLORES_NEON = {
      cian: { color: '#00ffff', glow: '#00ffff', bg: 'rgba(0, 255, 255, 0.1)' },
      magenta: { color: '#ff00ff', glow: '#ff00ff', bg: 'rgba(255, 0, 255, 0.1)' },
      amarillo: { color: '#ffff00', glow: '#ffff00', bg: 'rgba(255, 255, 0, 0.1)' },
      verdeMenta: { color: '#00ffaa', glow: '#00ffaa', bg: 'rgba(0, 255, 170, 0.1)' },
      naranjaQuemado: { color: '#ff6600', glow: '#ff6600', bg: 'rgba(255, 102, 0, 0.1)' },
      rojoCereza: { color: '#ff0033', glow: '#ff0033', bg: 'rgba(255, 0, 51, 0.1)' },
      azulElectro: { color: '#0044ff', glow: '#0044ff', bg: 'rgba(0, 68, 255, 0.1)' },
      lima: { color: '#aaff00', glow: '#aaff00', bg: 'rgba(170, 255, 0, 0.1)' }
    };

    const COLORES_POR_TIPO = {
      extracciones: COLORES_NEON.magenta,
      hierbas: COLORES_NEON.verdeMenta,
      hash: COLORES_NEON.naranjaQuemado,
      liados: COLORES_NEON.cian,
      munchies: COLORES_NEON.amarillo,
      eventos: COLORES_NEON.azulElectro
    };

    const EXTRACCIONES_LIST = [
      { nombre: "Ice fresh Frozen 90mc", precio: "12" },
      { nombre: "Ice fresh mix", precio: "18" },
      { nombre: "Ice frozen Georgia pie", precio: "20" },
      { nombre: "Ice fresh chapel", precio: "20" }
    ];
    
    const HIERBAS_LIST = [
      { nombre: "Amnesia haze pro", precio: "4" }, { nombre: "Chicken waffle", precio: "4" },
      { nombre: "Green Passion", precio: "4" }, { nombre: "White widow", precio: "4,5" },
      { nombre: "Trop cherry gas", precio: "4,5" }, { nombre: "Purple fruit", precio: "4,5" },
      { nombre: "Tropicanna", precio: "5" }, { nombre: "Chapel", precio: "5" },
      { nombre: "Georgia pie", precio: "5" }, { nombre: "OG kush", precio: "5" },
      { nombre: "Tricho Jordan", precio: "5" }, { nombre: "Cheetah piss", precio: "5" },
      { nombre: "Runtz", precio: "5" }, { nombre: "Menthol runtz", precio: "5" },
      { nombre: "Tropicana cherry", precio: "5,5" }, { nombre: "Gelato", precio: "5,5" },
      { nombre: "Chapel max", precio: "5,5" }, { nombre: "Skitlez", precio: "5,5" },
      { nombre: "Superboom (CANADA)", precio: "7" }, { nombre: "Tangle (CANADA)", precio: "7" },
      { nombre: "Gelato X purple+", precio: "7" }
    ];
    
    const HASH_LIST = [
      { nombre: "Polen", precio: "3,5" }, { nombre: "Polen", precio: "4" },
      { nombre: "Sonic", precio: "4" }, { nombre: "Bitcoin", precio: "5" },
      { nombre: "Banana Runtz", precio: "5" }, { nombre: "Mandarin cookies", precio: "5,5" },
      { nombre: "Cali gas", precio: "6" }, { nombre: "Hash", precio: "6" },
      { nombre: "Banana cherry", precio: "6" }, { nombre: "Cbd", precio: "6" },
      { nombre: "Chucky dry", precio: "6,5" }, { nombre: "Tropicana cookies", precio: "6,5" },
      { nombre: "Mimosa dry", precio: "7" }, { nombre: "Skitlez dry", precio: "7" },
      { nombre: "Dos y dos X Stardawg frozen", precio: "8,5" }, { nombre: "Frozen G10", precio: "9" },
      { nombre: "Mimosa frozen", precio: "10" }, { nombre: "Static", precio: "10" },
      { nombre: "Frozen forbidden fruit", precio: "10,5" }, { nombre: "Double static", precio: "12" }
    ];
    
    const LIADOS_LIST = [
      { nombre: "Liados mix (verde)", precio: "1x3 | 2x5 | 5x10" },
      { nombre: "Liados polen", precio: "1x3 | 2x5" },
      { nombre: "Liados Bitcoin", precio: "1x3,5" },
      { nombre: "Liados Cali gas", precio: "1x3,5" },
      { nombre: "Liados hash", precio: "1x3,5" },
      { nombre: "Untar Liado con rosin", precio: "2,5" }
    ];

    let secciones = [
      { id: "extracciones", nombre: "EXTRACCIONES", icono: "⚡", tipo: "productos", items: [], colorKey: "extracciones" },
      { id: "hierbas", nombre: "HIERBAS", icono: "🌿", tipo: "productos", items: [], colorKey: "hierbas" },
      { id: "hash", nombre: "HASH", icono: "🍫", tipo: "productos", items: [], colorKey: "hash" },
      { id: "liados", nombre: "LIADOS", icono: "🚬", tipo: "liados", items: [], colorKey: "liados" },
      { id: "munchies", nombre: "MUNCHIES", icono: "🍕", tipo: "munchies", sub: { bebidas: [], picar: [] }, colorKey: "munchies" },
      { id: "eventos", nombre: "EVENTOS", icono: "🎉", tipo: "eventos", items: [], colorKey: "eventos" }
    ];

    function crearImagenPlaceholder() {
      return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23222'/%3E%3Ctext x='100' y='110' fill='%23666' text-anchor='middle' font-size='14'%3ESIN FOTO%3C/text%3E%3C/svg%3E";
    }

    function mostrarErrorGuardado(error) {
      console.error('Error al guardar:', error);
      const texto = error && error.message ? error.message : String(error);
      mostrarEstado('❌ No se ha guardado: ' + texto, true);
    }

    function mostrarEstado(texto, persistente = false) {
      const el = document.getElementById('firebase-status');
      if (!el) return;
      el.textContent = texto;
      el.style.display = 'block';
      clearTimeout(window._estadoTimer);
      if (!persistente) window._estadoTimer = setTimeout(() => el.style.display = 'none', 3500);
    }

    function prepararPredeterminados() {
      secciones[0].items = EXTRACCIONES_LIST.map(item => ({ img: crearImagenPlaceholder(), ...item }));
      secciones[1].items = HIERBAS_LIST.map(item => ({ img: crearImagenPlaceholder(), ...item }));
      secciones[2].items = HASH_LIST.map(item => ({ img: crearImagenPlaceholder(), ...item }));
      secciones[3].items = LIADOS_LIST.map(item => ({ ...item }));
      secciones[4].sub = {
        bebidas: [{ nombre: 'COCACOLA', precio: '2' }, { nombre: 'AGUA', precio: '1,50' }],
        picar: [{ nombre: 'PATATAS', precio: '1,50' }]
      };
      secciones[5].items = [];
    }

    function resolverImagen(ruta) {
      return CatalogoFirebase.resolverImagen(ruta, () => renderizarTodo());
    }

    function abrirImagenGrande(url) {
      document.getElementById('modalImage').src = resolverImagen(url);
      document.getElementById('imageModal').classList.add('active');
    }

    function cerrarModalImagen() {
      document.getElementById('imageModal').classList.remove('active');
      document.getElementById('modalImage').src = '';
    }

    function renderizarTodo() {
      renderPestanas();
      renderPaneles();
    }

    function renderPestanas() {
      const container = document.getElementById('pestanasContainer');
      container.innerHTML = '';
      secciones.forEach((sec, idx) => {
        const pest = document.createElement('div');
        pest.className = 'pestana';
        if (idx === 0) pest.classList.add('activa');
        const color = getColorForSection(sec);
        pest.style.borderColor = color.color;
        pest.style.color = color.color;
        if (pest.classList.contains('activa')) {
          pest.style.boxShadow = `0 0 25px ${color.color}`;
        }
        pest.innerHTML = `<div class="pestana-icon">${sec.icono}</div><div class="pestana-text">${sec.nombre}</div>`;
        pest.addEventListener('click', (function(p, i, c) {
          return function() {
            document.querySelectorAll('.pestana').forEach(pest => {
              pest.classList.remove('activa');
              pest.style.boxShadow = '';
            });
            p.classList.add('activa');
            p.style.boxShadow = `0 0 25px ${c.color}`;
            document.querySelectorAll('.panel').forEach((pn, pi) => { pn.classList.toggle('activo', pi === i); });
          };
        })(pest, idx, color));
        container.appendChild(pest);
      });
    }

    function renderPaneles() {
      const contenedor = document.getElementById('contenidoPaneles');
      contenedor.innerHTML = '';
      secciones.forEach((sec, idx) => {
        const panel = document.createElement('div');
        panel.className = 'panel' + (idx === 0 ? ' activo' : '');
        let html = '';
        const secColor = getColorForSection(sec);
        
        if (sec.tipo === 'productos') {
          html = `<div class="subseccion" style="border: 1px solid ${secColor.color};"><h3 class="subseccion-titulo" style="border-left-color: ${secColor.color}; color: ${secColor.color};">${sec.icono} ${sec.nombre}</h3><div class="productos-grid" id="grid-${sec.id}"></div></div>`;
        } else if (sec.tipo === 'liados') {
          html = `<div class="subseccion" style="border: 1px solid ${secColor.color};"><h3 class="subseccion-titulo" style="border-left-color: ${secColor.color}; color: ${secColor.color};">🚬 ${sec.nombre}</h3><div class="liados-grid" id="grid-${sec.id}"></div></div>`;
        } else if (sec.tipo === 'munchies') {
          html = `<div><div class="munchies-categoria" style="border-color: ${secColor.color};"><div class="categoria-titulo" style="color: ${secColor.color}; border-bottom-color: ${secColor.color};">🥤 BEBIDAS</div><div class="items-lista" id="bebidas-lista-${sec.id}"></div></div>
                  <div class="munchies-categoria" style="border-color: ${secColor.color};"><div class="categoria-titulo" style="color: ${secColor.color}; border-bottom-color: ${secColor.color};">🍿 PICAR</div><div class="items-lista" id="picar-lista-${sec.id}"></div></div></div>`;
        } else if (sec.tipo === 'eventos') {
          html = `<div class="subseccion" style="border: 1px solid ${secColor.color};"><h3 class="subseccion-titulo" style="border-left-color: ${secColor.color}; color: ${secColor.color};">🎉 ${sec.nombre}</h3><div class="eventos-grid" id="eventos-grid-${sec.id}"></div></div>`;
        }
        panel.innerHTML = html;
        contenedor.appendChild(panel);
      });
      
      secciones.forEach(sec => {
        if (sec.tipo === 'productos') llenarProductos(sec);
        if (sec.tipo === 'liados') llenarLiados(sec);
        if (sec.tipo === 'munchies') llenarMunchies(sec);
        if (sec.tipo === 'eventos') llenarEventos(sec);
      });
    }

    function llenarProductos(sec) {
      const grid = document.getElementById(`grid-${sec.id}`);
      if (!grid) return;
      const color = getColorForSection(sec);
      grid.innerHTML = '';
      sec.items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'producto-card';
        card.style.borderColor = color.color;
        card.style.boxShadow = `0 0 15px ${color.glow}`;
        card.style.color = color.color;
        // SIN SÍMBOLO DE EURO - solo el número
        card.innerHTML = `<img src="${resolverImagen(item.img)}" style="border-color: ${color.color}; box-shadow: 0 0 15px ${color.color};"><h4 style="color: white;">${escapeHtml(item.nombre)}</h4><div class="producto-precio" style="color: ${color.color}; border-color: ${color.color}; background: ${color.bg};">${escapeHtml(item.precio)}</div>`;
        card.addEventListener('click', () => { if(item.img) abrirImagenGrande(item.img); });
        grid.appendChild(card);
      });
    }

    function llenarLiados(sec) {
      const grid = document.getElementById(`grid-${sec.id}`);
      if (!grid) return;
      const color = getColorForSection(sec);
      grid.innerHTML = '';
      sec.items.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'liado-card';
        div.style.borderColor = color.color;
        div.style.boxShadow = `0 0 15px ${color.glow}`;
        div.style.color = color.color;
        // SIN SÍMBOLO - se muestra exactamente como está guardado (1x3 | 2x5 o 2,5)
        div.innerHTML = `<div class="liado-icon" style="filter: drop-shadow(0 0 10px ${color.color});">🚬</div><h4 style="color: ${color.color};">${escapeHtml(item.nombre)}</h4><div class="liado-precio" style="color: ${color.color}; border-color: ${color.color}; background: ${color.bg};">${escapeHtml(item.precio)}</div>`;
        grid.appendChild(div);
      });
    }

    function llenarMunchies(sec) {
      const color = getColorForSection(sec);
      const bebidasDiv = document.getElementById(`bebidas-lista-${sec.id}`);
      const picarDiv = document.getElementById(`picar-lista-${sec.id}`);
      if (bebidasDiv) {
        bebidasDiv.innerHTML = '';
        sec.sub.bebidas.forEach(item => { 
          // SIN SÍMBOLO DE EURO
          bebidasDiv.innerHTML += `<div class="item-munchi" style="border-color: ${color.color};"><span class="item-nombre">${escapeHtml(item.nombre)}</span><span class="item-precio" style="color: ${color.color};">${escapeHtml(item.precio)}</span></div>`; 
        });
      }
      if (picarDiv) {
        picarDiv.innerHTML = '';
        sec.sub.picar.forEach(item => { 
          // SIN SÍMBOLO DE EURO
          picarDiv.innerHTML += `<div class="item-munchi" style="border-color: ${color.color};"><span class="item-nombre">${escapeHtml(item.nombre)}</span><span class="item-precio" style="color: ${color.color};">${escapeHtml(item.precio)}</span></div>`; 
        });
      }
    }

    function llenarEventos(sec) {
      const grid = document.getElementById(`eventos-grid-${sec.id}`);
      if (!grid) return;
      const color = getColorForSection(sec);
      grid.innerHTML = '';
      sec.items.forEach((img, idx) => {
        const card = document.createElement('div');
        card.className = 'evento-card';
        card.style.borderColor = color.color;
        card.style.boxShadow = `0 0 15px ${color.glow}`;
        card.style.color = color.color;
        card.innerHTML = `<img src="${resolverImagen(img)}"><button class="evento-delete" onclick="eliminarEvento('${sec.id}', ${idx})">✖</button>`;
        card.addEventListener('click', (e) => { if(!e.target.classList.contains('evento-delete')) abrirImagenGrande(img); });
        grid.appendChild(card);
      });
    }

    function eliminarEvento(secId, index) {
      const sec = secciones.find(s => s.id === secId);
      if (sec && sec.items[index]) {
        sec.items.splice(index, 1);
        guardarCompleto();
        renderizarTodo();
        if (document.getElementById("panel-admin").style.display === "block") {
          mostrarSeccionAdmin(secId);
        }
      }
    }

    function escapeHtml(str) { 
      return String(str || "").replace(/[&<>]/g, function(m){ 
        if(m==="&") return "&amp;"; 
        if(m==="<") return "&lt;"; 
        if(m===">") return "&gt;"; 
        return m;
      }); 
    }


    async function iniciarCatalogo() {
      prepararPredeterminados();
      renderizarTodo();
      try {
        CatalogoFirebase.escucharCatalogo(datos => {
          if (datos && Array.isArray(datos.secciones)) {
            secciones = datos.secciones;
            renderizarTodo();
          } else {
            mostrarEstado('Catálogo de ejemplo. Pendiente de publicar desde el administrador.');
          }
        }, mostrarErrorGuardado);
      } catch (error) { mostrarErrorGuardado(error); }
    }
    window.addEventListener('load', iniciarCatalogo);
  </script>
</body>
</html>
